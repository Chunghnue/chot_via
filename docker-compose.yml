services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xinvia
      POSTGRES_PASSWORD: xinvia
      POSTGRES_DB: xinvia
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
volumes:
  postgres_data:
